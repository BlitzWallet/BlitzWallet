# Hidden preference (T12-T14): every amount input shows sats, the send review shows
# sats and the fee, and the Home total shows the hidden glyph. Never sends; the
# confirm page under Hidden is covered by funded/fiat-history-send.yaml's sibling
# run (send once under Hidden if the owner wants it proven on mainnet).
#
# Needs a logged-in throwaway wallet (PIN 1111) on Home, Fast Pay off.
# Leaves the wallet set to Hidden + USD.
#
# maestro test -e APP_ID=org.reactjs.native.example.BlitzWallet -e INVOICE=lnbc1... \
#   --format junit --output e2e-artifacts/report.xml --test-output-dir e2e-artifacts \
#   .maestro/hidden-essentials.yaml
appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: '(Good (morning|afternoon|evening)|Receive)'
    timeout: 30000
- runFlow:
    when:
      visible: 'Good (morning|afternoon|evening)'
    commands:
      - tapOn: '1'
      - tapOn: '1'
      - tapOn: '1'
      - tapOn: '1'
- extendedWaitUntil:
    visible: Receive
    timeout: 30000

- runFlow:
    file: funded/_set-fiat-display.yaml
    env:
      CURRENCY_CODE: USD
      CURRENCY_NAME: US Dollar
      DISPLAY_CODE: 'hidden'

# Home total is masked.
- assertVisible: '.*•.*'
- takeScreenshot: hidden-home

# amount input stays visible, in sats (T12).
- tapOn: Receive
- tapOn: Bitcoin
- tapOn: Create invoice
- extendedWaitUntil:
    visible: Change currency
    timeout: 30000
- tapOn: '5'
- tapOn: '0'
- assertVisible: '(₿\s?50|50\s?sats?)'
- assertNotVisible: '.*•.*'
- takeScreenshot: hidden-amount-input
- tapOn: Back
- tapOn: Back

# Send review shows sats and the fee, not the mask (T13, T14).
- tapOn: Send
- tapOn:
    text: .*address.*
- inputText: ${INVOICE}
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: Next
- extendedWaitUntil:
    visible: Pay with
    timeout: 30000
# PaymentMethod row keeps its balance under Hidden.
- assertVisible: 'Bitcoin · .*'
- tapOn: '1'
- tapOn: '0'
- tapOn: '0'
- assertVisible: Review
- tapOn: Review
- extendedWaitUntil:
    visible: Slide to send
    timeout: 30000
- assertVisible: '(₿\s?\d[\d ,]*|[\d ,]*\d\s?sats?)'
- assertVisible: Fee.*
- assertNotVisible: '.*•{3,}.*'
- takeScreenshot: hidden-send-review
