<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, interactive-widget=resizes-content, viewport-fit=cover"
    />

    <!-- Primary SEO — primary canonical is wallet.blitzwalletapp.com; JS below keeps social cards host-aware for Netlify aliases -->
    <title>%WEB_TITLE% | Send Bitcoin and Dollars Anywhere</title>
    <meta
      name="description"
      content="Blitz Wallet is a free wallet for Bitcoin and dollars. Send money to anyone in seconds. It works right in your browser. No download. No sign-up."
    />
    <meta name="author" content="Blitz Wallet" />
    <meta
      name="keywords"
      content="Blitz Wallet, self-custodial Bitcoin wallet, Lightning wallet, stablecoin wallet, USDB, USDT, USDC, global payments app, Bitcoin payments, Spark Bitcoin Layer 2, PWA wallet, web wallet, no KYC Bitcoin wallet"
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="googlebot" content="index, follow" />
    <!-- Primary canonical. Served on Netlify from blitzwalletapp.com, blitz-wallet.com and blitzwallet.app — all aliases canonicalize here to consolidate SEO equity. If you want each domain to self-canonicalize instead, change href to current host via the script below. -->
    <link rel="canonical" href="https://wallet.blitzwalletapp.com/" />
    <!-- Alternate Netlify aliases (hint for crawlers; canonical still points to primary) -->
    <link
      rel="alternate"
      href="https://wallet.blitzwalletapp.com/"
      hreflang="x-default"
    />
    <link
      rel="alternate"
      href="https://wallet.blitz-wallet.com/"
      hreflang="x-default"
    />
    <link
      rel="alternate"
      href="https://wallet.blitzwallet.app/"
      hreflang="x-default"
    />
    <meta name="application-name" content="Blitz Wallet" />
    <meta name="theme-color" content="#EBEBEB" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blitz" />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/pwa/apple-touch-icon.png?v=2"
    />
    <!-- Transparent-background favicon: icon-192/512 are flattened onto white for PWA/Apple, which shows as a white box in browser tabs -->
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/favicon.png" />

    <!-- Open Graph / Facebook — og:url and twitter:url are host-aware via script below for correct social previews on alias domains -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blitz Wallet" />
    <meta property="og:locale" content="%LANG_ISO_CODE%" />
    <meta
      property="og:title"
      content="Blitz Wallet | Send Bitcoin and Dollars Anywhere"
    />
    <meta
      property="og:description"
      content="Send money as easily as you send a text. Pay friends for free. Payments arrive in seconds, in any country. Hold Bitcoin or dollars. Only you control your money. No download. No sign-up."
    />
    <meta
      property="og:image"
      content="https://wallet.blitzwalletapp.com/twitterCard.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://wallet.blitzwalletapp.com/twitterCard.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta
      property="og:image:alt"
      content="Blitz Wallet. A simple wallet for Bitcoin and dollars."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@BlitzWalletApp" />
    <meta name="twitter:creator" content="@BlitzWalletApp" />
    <meta
      name="twitter:title"
      content="Blitz Wallet | Send Bitcoin and Dollars Anywhere"
    />
    <meta
      name="twitter:description"
      content="A simple wallet for everyday payments. Use it in your browser. Pay friends for free. Send money to any country in seconds. Hold Bitcoin or dollars. Free and open source."
    />
    <meta
      name="twitter:image"
      content="https://wallet.blitzwalletapp.com/twitterCard.png"
    />
    <meta
      name="twitter:image:alt"
      content="Blitz Wallet. Send money as easily as a text."
    />

    <!-- Structured Data — primary URL is blitzwalletapp.com per llms.txt; aliases listed in sameAs for entity consolidation -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Blitz Wallet Web",
        "alternateName": "Blitz Wallet",
        "isPartOf": {
          "@type": "WebSite",
          "name": "Blitz Wallet",
          "url": "https://blitzwalletapp.com/",
          "alternateName": [
            "https://blitz-wallet.com/",
            "https://blitzwallet.app/"
          ]
        },
        "description": "Blitz Wallet lets you send money to anyone, anywhere. It is as easy as sending a text. Payments to friends are free. Money arrives in seconds. You can hold Bitcoin or digital dollars (USDB, USDT, USDC). Only you control your money. No download. No sign-up.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Pay friends by username. Payments between Blitz users are free.",
          "Request money from your contacts.",
          "Split a bill with friends.",
          "Send money as a gift with a simple link.",
          "Collect money from a group with a pool.",
          "Hold Bitcoin or digital dollars (USDB, USDT, USDC).",
          "Switch between Bitcoin and dollars in the app.",
          "Send and receive on Lightning, Spark and the Bitcoin network.",
          "Get a deposit address that turns USDC or USDT into Bitcoin or dollars.",
          "Scan a QR code to pay.",
          "Save toward goals.",
          "Keep separate accounts for different needs.",
          "Set up a wallet for your child with a spending limit.",
          "Take payments in your shop without a card reader.",
          "Buy gift cards with Bitcoin.",
          "Find places near you that accept Bitcoin.",
          "See where your money goes.",
          "Show prices in your local currency.",
          "Use the app in 8 languages.",
          "Back up your wallet with 12 words.",
          "Lock your wallet with a PIN or passkey."
        ],
        "publisher": {
          "@type": "Organization",
          "name": "Blitz Wallet",
          "url": "https://blitzwalletapp.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://wallet.blitzwalletapp.com/pwa/icon-512.png?v=2"
          },
          "sameAs": [
            "https://github.com/BlitzWallet/BlitzWallet",
            "https://x.com/BlitzWalletApp",
            "https://apps.apple.com/us/app/blitz-wallet/id6476810582",
            "https://play.google.com/store/apps/details?id=com.blitzwallet",
            "https://blitzwalletapp.com/",
            "https://blitz-wallet.com/",
            "https://blitzwallet.app/",
            "https://wallet.blitz-wallet.com/",
            "https://wallet.blitzwallet.app/"
          ]
        },
        "image": "https://wallet.blitzwalletapp.com/twitterCard.png",
        "inLanguage": "%LANG_ISO_CODE%"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Blitz Wallet",
        "url": "https://blitzwalletapp.com/",
        "logo": "https://wallet.blitzwalletapp.com/pwa/icon-512.png?v=2",
        "description": "Blitz Wallet is a free, open source wallet for Bitcoin and digital dollars. It feels like Venmo or Cash App. But it works in every country. Only you hold the keys to your money.",
        "sameAs": [
          "https://github.com/BlitzWallet/BlitzWallet",
          "https://x.com/BlitzWalletApp",
          "https://blitz-wallet.com/",
          "https://blitzwallet.app/",
          "https://wallet.blitz-wallet.com/",
          "https://wallet.blitzwallet.app/"
        ]
      }
    </script>
    <style id="expo-reset">
      html,
      body {
        height: 100vh;
        background-color: #ebebeb;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        position: fixed;
        top: var(--app-viewport-top, 0px);
        left: 0;
        width: 100%;
        height: var(--app-viewport-height, 100vh);
        overflow: hidden;
      }

      input:focus,
      textarea:focus {
        outline: none !important;
        box-shadow: none !important;
      }

      * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
      input,
      textarea {
        -moz-user-select: text;
        user-select: text;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
